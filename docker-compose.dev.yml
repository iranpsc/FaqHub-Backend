# Local development stack for FaqHub Backend
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml logs -f
#
# Code is bind-mounted for live edits. Static uploads use /opt/faqhub
# (override with FAQHUB_STATIC_PATH).

name: faqhub-dev

x-docker-registry: &docker-registry docker.arvancloud.ir

x-app-common: &app-common
  image: faqhub-app-dev:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    target: app-dev
  restart: unless-stopped
  env_file:
    - .env
  environment: &app-env
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: ${APP_URL:-http://localhost:8080}
    DB_CONNECTION: app
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-faqhub}
    DB_USERNAME: ${DB_USERNAME:-faqhub}
    DB_PASSWORD: ${DB_PASSWORD:-faqhub}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ""
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: reverb
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_HOST: ${REVERB_HOST:-localhost}
    REVERB_PORT: ${REVERB_PORT:-8080}
    REVERB_SCHEME: http
    REVERB_APP_ID: ${REVERB_APP_ID:-faqhub}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-faqhub-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-faqhub-secret}
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    LOG_CHANNEL: stderr
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  volumes:
    - .:/var/www/html
    - /var/www/html/vendor
    - /var/www/html/node_modules
    - ${FAQHUB_STATIC_PATH:-/opt/faqhub}:/opt/faqhub
  networks:
    - faqhub
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/nginx:1.27-alpine
    container_name: faqhub-dev-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${FAQHUB_STATIC_PATH:-/opt/faqhub}:/opt/faqhub:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - faqhub
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    <<: *app-common
    container_name: faqhub-dev-app
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "true"
      CACHE_CONFIG: "false"
      COMPOSER_INSTALL: "true"
    ports:
      - "${PHP_FPM_PORT:-9000}:9000"
      - "${XDEBUG_PORT:-9003}:9003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["php-fpm", "-F"]

  queue:
    <<: *app-common
    container_name: faqhub-dev-queue
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *app-common
    container_name: faqhub-dev-scheduler
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
    depends_on:
      app:
        condition: service_started

  reverb:
    <<: *app-common
    container_name: faqhub-dev-reverb
    environment:
      <<: *app-env
      CONTAINER_ROLE: reverb
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
    ports:
      - "${REVERB_PUBLISH_PORT:-8081}:8080"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  vite:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/node:22-alpine
    container_name: faqhub-dev-vite
    working_dir: /var/www/html
    command: sh -c "npm config set registry https://package-mirror.liara.ir/repository/npm/ && npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    environment:
      VITE_HOST: 0.0.0.0
    networks:
      - faqhub
    restart: unless-stopped

  mysql:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/library/mysql:8.4
    container_name: faqhub-dev-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-faqhub}
      MYSQL_USER: ${DB_USERNAME:-faqhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-faqhub}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - faqhub
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/library/redis:7-alpine
    container_name: faqhub-dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_PUBLISH:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - faqhub
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mailpit:
    image: ${DOCKER_REGISTRY:-docker.arvancloud.ir}/axllent/mailpit:latest
    container_name: faqhub-dev-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - faqhub

networks:
  faqhub:
    driver: bridge

volumes:
  mysql_dev_data:
  redis_dev_data:
