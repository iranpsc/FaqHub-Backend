# Production stack for FaqHub Backend (Dokploy / server)
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#
# Host bind mounts (create on the server before first deploy):
#   ${FAQHUB_STATIC_PATH:-/opt/faqhub}/storage   -> storage/app/public
#   ${FAQHUB_STATIC_PATH:-/opt/faqhub}/sitemaps  -> public/sitemaps
#
# Published ports:
#   app        ${APP_PORT:-8000}              -> 8000
#   reverb     ${REVERB_PUBLISH_PORT:-8080}   -> 8080
#   mysql      ${MYSQL_PORT:-3306}            -> 3306
#   redis      ${REDIS_PORT_PUBLISH:-6379}    -> 6379

name: faqhub

x-app-common: &app-common
  image: faqhub-app:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  restart: unless-stopped
  env_file:
    - .env
  environment: &app-env
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8000}
    DB_CONNECTION: ${DB_CONNECTION:-app}
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-faqhub}
    DB_USERNAME: ${DB_USERNAME:-faqhub}
    DB_PASSWORD: ${DB_PASSWORD:-faqhub}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    CACHE_STORE: ${CACHE_STORE:-redis}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_HOST: ${REVERB_HOST:-localhost}
    REVERB_PORT: ${REVERB_PORT:-8080}
    REVERB_SCHEME: ${REVERB_SCHEME:-http}
    REVERB_APP_ID: ${REVERB_APP_ID:-faqhub}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-faqhub-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-faqhub-secret}
    LOG_CHANNEL: stderr
  volumes:
    - ${FAQHUB_STATIC_PATH:-/opt/faqhub}/storage:/var/www/html/storage/app/public
    - ${FAQHUB_STATIC_PATH:-/opt/faqhub}/sitemaps:/var/www/html/public/sitemaps
  networks:
    - faqhub
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-common
    container_name: faqhub-app
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CACHE_CONFIG: ${CACHE_CONFIG:-true}
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    <<: *app-common
    container_name: faqhub-queue
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    healthcheck:
      disable: true

  scheduler:
    <<: *app-common
    container_name: faqhub-scheduler
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    healthcheck:
      disable: true

  reverb:
    <<: *app-common
    container_name: faqhub-reverb
    environment:
      <<: *app-env
      CONTAINER_ROLE: reverb
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    ports:
      - "${REVERB_PUBLISH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    container_name: faqhub-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-faqhub}
      MYSQL_USER: ${DB_USERNAME:-faqhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-faqhub}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - faqhub
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: faqhub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT_PUBLISH:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - faqhub
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  faqhub:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
