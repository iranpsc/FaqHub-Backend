# Production stack for FaqHub Backend (Dokploy)
#
# Host bind mounts:
#   ${FAQHUB_STATIC_PATH:-/opt/faqhub}/storage   -> storage/app/public
#   ${FAQHUB_STATIC_PATH:-/opt/faqhub}/sitemaps  -> public/sitemaps
#
# Networks:
#   faqhub           private bridge — app, workers, MySQL, Redis
#   dokploy-network  external Dokploy/Traefik network (must already exist)
#
# Dokploy domains (UI) target app:8000 (API) and reverb:8080 (WebSocket).
# Those two services are dual-homed. traefik.docker.network pins Traefik to
# dokploy-network so it does not pick the private bridge and 504.
# mysql, redis, queue, and scheduler stay on faqhub only.

x-app-common: &app-common
  image: faqhub-backend:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  restart: unless-stopped
  env_file:
    - .env
  environment: &app-env
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8000}
    DB_CONNECTION: ${DB_CONNECTION:-app}
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-faqhub}
    DB_USERNAME: ${DB_USERNAME:-faqhub}
    DB_PASSWORD: ${DB_PASSWORD:-faqhub}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    CACHE_STORE: ${CACHE_STORE:-redis}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_HOST: ${REVERB_HOST:-localhost}
    REVERB_PORT: ${REVERB_PORT:-8080}
    REVERB_SCHEME: ${REVERB_SCHEME:-http}
    REVERB_APP_ID: ${REVERB_APP_ID:-faqhub}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-faqhub-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-faqhub-secret}
    LOG_CHANNEL: stderr
  volumes:
    - ${FAQHUB_STATIC_PATH:-/opt/faqhub}/storage:/var/www/html/storage/app/public
    - ${FAQHUB_STATIC_PATH:-/opt/faqhub}/sitemaps:/var/www/html/public/sitemaps
  networks:
    - faqhub
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-common
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CACHE_CONFIG: ${CACHE_CONFIG:-true}
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    networks:
      - faqhub
      - dokploy-network
    labels:
      - traefik.docker.network=${DOKPLOY_NETWORK:-dokploy-network}
    expose:
      - "8000"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    <<: *app-common
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    healthcheck:
      disable: true

  scheduler:
    <<: *app-common
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    healthcheck:
      disable: true

  reverb:
    <<: *app-common
    environment:
      <<: *app-env
      CONTAINER_ROLE: reverb
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    networks:
      - faqhub
      - dokploy-network
    labels:
      - traefik.docker.network=${DOKPLOY_NETWORK:-dokploy-network}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-faqhub}
      MYSQL_USER: ${DB_USERNAME:-faqhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-faqhub}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - faqhub
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - faqhub
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  faqhub:
    driver: bridge
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}

volumes:
  mysql_data:
  redis_data:
